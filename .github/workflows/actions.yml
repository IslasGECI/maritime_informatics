name: Tests
on: push
jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
    - name: Copia repositorio
      uses: actions/checkout@main
    - name: Construye imagen
      run: docker build --tag islasgeci/templater .
    - name: Verifica el formato
      run: docker run islasgeci/templater make check
    - name: Corre pruebas y evalúa cobertura
      run: docker run islasgeci/templater make coverage
    - name: Corre mutation testing
      run: docker run islasgeci/templater make mutants
    - name: Create/Update tag
      uses: rickstaa/action-create-tag@v1.5.4
      with:
        tag: "latest"
        message: "Latest release"
        force_push_tag: true
    - name: Docker log-in
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
    - name: Push latest Docker image to Docker Hub
      run: docker push islasgeci/templater:latest
    - name: Push SHA tag to Docker Hub
      run: |
        docker tag islasgeci/templater:latest islasgeci/templater:${GITHUB_SHA:0:4}
        docker push islasgeci/templater:${GITHUB_SHA:0:4}
